[package]
name = "terminal_app"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
path = "src/app.rs"

[[bin]]
name = "terminal-app"
path = "src/main.rs"
doctest = false


[dependencies]
anyhow.workspace = true
assets.workspace = true
fs.workspace = true
gpui = { workspace = true, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
itertools.workspace = true
log.workspace = true
collections.workspace = true
paths.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
settings.workspace = true
terminal_core = { path = "../terminal_core" }
theme.workspace = true
theme_settings.workspace = true
ui.workspace = true
util.workspace = true

[build-dependencies]
embed-resource = "=3.0.6"

[package.metadata.bundle]
name = "ZedTerm"
identifier = "dev.zed.ZedTerm"
icon = ["resources/app-icon@2x.png", "resources/app-icon.png"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
proptest.workspace = true
settings = { workspace = true, features = ["test-support"] }
terminal_core = { path = "../terminal_core", features = ["test-support"] }